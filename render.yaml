services:
  - type: web
    name: tempo-certo-api
    runtime: docker
    plan: free
    rootDir: api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
