spring.application.name=tempo-certo
server.port=${PORT:8080}
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/test}
spring.data.mongodb.auto-index-creation=true
spring.mvc.problemdetails.enabled=true
management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
tempocerto.cors-origin=${FRONTEND_ORIGIN:http://localhost:3000}
tempocerto.admin-key=${ADMIN_KEY:}
tempocerto.webhook-url=${N8N_WEBHOOK_URL:}
tempocerto.webhook-key=${N8N_WEBHOOK_KEY:}
tempocerto.sentry-dsn=${SENTRY_DSN:}
logging.structured.format.console=ecs
